<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Register — CleanOps Connect</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="alternate icon" href="/favicon-32.png" />
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <header class="site-header">
    <nav id="site-nav"></nav>
  </header>

  <main>
    <div class="card" style="max-width: 480px; margin: 0 auto;">
      <h2>Create an account</h2>
      <div id="alert" class="alert alert-error" hidden></div>

      <form id="register-form">
        <div class="form-row">
          <label for="role">I am a</label>
          <select id="role" required>
            <option value="customer">Customer (I need cleaning done)</option>
            <option value="cleaner">Cleaner (I offer cleaning services)</option>
          </select>
        </div>

        <div class="form-row">
          <label for="name">Full name</label>
          <input id="name" type="text" required />
        </div>

        <div class="form-row">
          <label for="email">Email</label>
          <input id="email" type="email" required />
        </div>

        <div class="form-row">
          <label for="phone">Phone (optional)</label>
          <input id="phone" type="tel" />
        </div>

        <div class="form-row">
          <label for="password">Password</label>
          <input id="password" type="password" minlength="8" required />
          <span class="field-help">At least 8 characters.</span>
        </div>

        <button type="submit">Create account</button>
      </form>
    </div>
  </main>

  <script type="module" src="js/nav.js"></script>
  <script type="module" src="js/register.js"></script>
</body>
</html>
