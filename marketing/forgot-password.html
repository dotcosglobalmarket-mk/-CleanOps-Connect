<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Forgot password — CleanOps Connect</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="alternate icon" href="/favicon-32.png" />
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <meta name="theme-color" content="#0A1A2F" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="CleanOps" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <header class="site-header">
    <nav id="site-nav"></nav>
  </header>

  <main>
    <div class="card" style="max-width: 420px; margin: 0 auto;">
      <h2>Forgot password</h2>
      <p class="field-help">Enter your account email and we'll send you a link to reset your password.</p>
      <div id="alert" class="alert alert-error" hidden></div>
      <div id="success" class="alert alert-success" hidden></div>

      <form id="forgot-password-form">
        <div class="form-row">
          <label for="email">Email</label>
          <input id="email" type="email" required />
        </div>

        <button type="submit">Send reset link</button>
      </form>

      <p style="margin-top: 1rem; font-size: 0.9rem;">
        <a href="login.html">Back to log in</a>
      </p>
    </div>
  </main>

  <footer class="auth-footer">
    <p><a href="privacy.html">Privacy notice</a> · <a href="terms.html">Terms of use</a> · <a href="cookies.html">Cookies</a></p>
    <p class="legal-company">Ethnatcel Care Ltd (Company No. 12674639), registered in England &amp; Wales · ICO Reg. No. ZC137204</p>
  </footer>

  <script type="module" src="js/nav.js"></script>
  <script type="module" src="js/forgot-password.js"></script>
</body>
</html>
