<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reset password — CleanOps Connect</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="alternate icon" href="/favicon-32.png" />
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <meta name="theme-color" content="#0A1A2F" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="CleanOps" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <header class="site-header">
    <nav id="site-nav"></nav>
  </header>

  <main>
    <div class="card" style="max-width: 420px; margin: 0 auto;">
      <h2>Reset password</h2>
      <div id="no-token-alert" class="alert alert-error" hidden>
        This link is missing its reset token. Request a new one from the
        <a href="forgot-password.html">forgot password</a> page.
      </div>
      <div id="alert" class="alert alert-error" hidden></div>

      <form id="reset-password-form">
        <div class="form-row">
          <label for="password">New password</label>
          <input id="password" type="password" minlength="8" required />
        </div>
        <div class="form-row">
          <label for="confirmPassword">Confirm new password</label>
          <input id="confirmPassword" type="password" minlength="8" required />
        </div>

        <button type="submit">Reset password</button>
      </form>
      <div id="two-factor-step" hidden></div>
    </div>
  </main>

  <footer class="auth-footer">
    <p><a href="privacy.html">Privacy notice</a> · <a href="terms.html">Terms of use</a> · <a href="cookies.html">Cookies</a></p>
    <p class="legal-company">Ethnatcel Care Ltd (Company No. 12674639), registered in England &amp; Wales · ICO Reg. No. ZC137204</p>
  </footer>

  <script type="module" src="js/nav.js"></script>
  <script type="module" src="js/reset-password.js"></script>
</body>
</html>
