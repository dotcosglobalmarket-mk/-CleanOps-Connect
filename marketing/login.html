<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Log in — CleanOps Connect</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="alternate icon" href="/favicon-32.png" />
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <meta name="theme-color" content="#0A1A2F" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="CleanOps" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <header class="site-header">
    <nav id="site-nav"></nav>
  </header>

  <main>
    <div class="auth-layout">
    <figure class="auth-photo">
      <img src="/img/auth-login.jpg" width="1400" height="781" alt="A cleaner in a navy apron and yellow gloves carrying a bucket of cleaning supplies through a living room while two colleagues dust and vacuum" />
      <figcaption>
        <strong>Welcome back</strong>
        <span>Log in to manage your jobs, offers and payouts.</span>
      </figcaption>
    </figure>
    <div class="card">
      <h2 data-hide-on-step>Log in</h2>
      <div id="alert" class="alert alert-error" hidden></div>

      <form id="login-form">
        <div class="form-row">
          <label for="email">Email</label>
          <input id="email" type="email" required />
        </div>

        <div class="form-row">
          <label for="password">Password</label>
          <input id="password" type="password" required />
        </div>

        <p style="margin: -0.5rem 0 1rem; font-size: 0.85rem;">
          <a href="forgot-password.html">Forgot password?</a>
        </p>

        <button type="submit">Log in</button>
      </form>

      <div id="two-factor-step" hidden></div>

      <p data-hide-on-step style="margin-top: 1rem; font-size: 0.9rem;">
        Don't have an account? <a href="register.html">Register</a>
      </p>
    </div>
    </div>
  </main>

  <footer class="auth-footer">
    <p><a href="privacy.html">Privacy notice</a> · <a href="terms.html">Terms of use</a> · <a href="cookies.html">Cookies</a></p>
    <p class="legal-company">Ethnatcel Care Ltd (Company No. 12674639), registered in England &amp; Wales · ICO Reg. No. ZC137204</p>
  </footer>

  <script type="module" src="js/nav.js"></script>
  <script type="module" src="js/login.js"></script>
</body>
</html>
