<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0A1A2F" />
  <title>You're offline — CleanOps Connect</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 1.5rem; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; background: #f7faf9; color: #1f2937; text-align: center; }
    main { max-width: 26rem; }
    h1 { font-size: 1.5rem; margin: 0 0 0.5rem; }
    p { color: #6b7280; line-height: 1.5; }
    button { margin-top: 1rem; padding: 0.7rem 1.4rem; border: 0; border-radius: 8px; background: #0f766e; color: #fff; font-size: 1rem; font-weight: 600; cursor: pointer; }
  </style>
</head>
<body>
  <main>
    <h1>You're offline</h1>
    <p>CleanOps Connect needs an internet connection to show your jobs and messages. Check your signal and try again.</p>
    <button type="button" onclick="location.reload()">Try again</button>
  </main>
</body>
</html>
