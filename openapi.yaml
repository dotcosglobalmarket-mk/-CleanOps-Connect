      description: >-
        Needs `identityChecked: true`, the account's email typed again as `confirmEmail`, and a reason.
        Refused while a booking is in progress or has money to settle, while a regular booking is
        running, or while a cleaner has an active subscription. Otherwise the Stripe customer is deleted
        first (if that fails nothing else changes, so it can be retried), then pictures, certificate
        files and messages are deleted, address and free text are removed from bookings, payment records
        are kept for 6 years, and the account is anonymised and signed out. Recorded in the audit log.


        Allowed roles: admin.
      tags:
        - Admin
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                identityChecked:
                  type: boolean
                  enum:
                    - true
                confirmEmail:
                  type: string
                  minLength: 3
                  maxLength: 254
                reason:
                  type: string
                  minLength: 3
                  maxLength: 450
              required:
                - identityChecked
                - confirmEmail
                - reason
      responses:
