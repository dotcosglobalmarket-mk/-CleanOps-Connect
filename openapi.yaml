          description: Sign in required
        '403':
          description: Your account is not allowed to do this

  /series/{id}/end:
    post:
      summary: Give notice to end a regular booking
      description: >-
        The cleaner gives 14 days' notice. The last visit is the one on or before the end of the notice;
        later visits are dropped. Notice can be given once.


        Allowed roles: cleaner.
      tags:
        - Regular bookings
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Success
        '400':
          description: The request is not valid
        '401':
          description: Sign in required
        '403':
          description: Your account is not allowed to do this

  /series/{id}/pause:
    post:
      summary: Pause a regular booking
      description: >-
        Only a running booking can be paused. The cleaner is told. No visits are charged while it is
        paused.


        Allowed roles: customer.
      tags:
        - Regular bookings
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Success
        '400':
          description: The request is not valid
        '401':
          description: Sign in required
        '403':
          description: Your account is not allowed to do this

  /series/{id}/resume:
    post:
      summary: Resume a paused regular booking
      description: >-
        Needs a saved card and the customer's agreement to the card wording first. The count of cleaner
        cancellations starts again.


        Allowed roles: customer.
      tags:
        - Regular bookings
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Success
        '400':
          description: The request is not valid
        '401':
          description: Sign in required
        '403':
          description: Your account is not allowed to do this

  /series/{id}/visits/{jobId}/cleaner-cancel:
    post:
      summary: Cancel one visit of a regular booking
      description: >-
        The cleaner cannot do one visit. The customer is refunded in full, it is logged against the
        cleaner, and a second one pauses the booking.


        Allowed roles: cleaner.
      tags:
        - Regular bookings
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: jobId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Success
        '400':
          description: The request is not valid
        '401':
          description: Sign in required
        '403':
          description: Your account is not allowed to do this

  /series/{id}/visits/{jobId}/skip:
    post:
      summary: Skip one visit of a regular booking
      description: >-
        Free until the visit is charged (48 hours before it). After that it is paid for, so the usual
        late-cancellation rule applies (half back).


        Allowed roles: customer.
      tags:
        - Regular bookings
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: jobId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Success
        '400':
          description: The request is not valid
        '401':
          description: Sign in required
        '403':
          description: Your account is not allowed to do this

  /series/mine:
    get:
      summary: List my regular bookings
      description: |-
        Your own regular bookings with their upcoming visits and which actions apply to each.

        Allowed roles: customer, cleaner.
      tags:
        - Regular bookings
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Success
        '401':
          description: Sign in required
        '403':
          description: Your account is not allowed to do this

  /service-types:
    get:
      summary: List service types
      description: >-
        No sign-in needed: the website uses it to fill the "service type" list when a customer posts a
        job. Optional `category` filter (`domestic` or `industrial`).
      tags:
        - Service types
      parameters:
        - name: category
          in: query
          required: false
          schema:
            type: string
            enum:
              - domestic
              - industrial
      responses:
        '200':
          description: Success
        '400':
          description: The request is not valid
    post:
      summary: Add a service type
      description: |-
        Admin only.

        Allowed roles: admin.
      tags:
        - Service types
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  minLength: 1
                category:
                  type: string
                  enum:
                    - domestic
                    - industrial
                description:
                  type: string
                requiresCoshh:
                  type: boolean
              required:
                - name
                - category
      responses:
        '201':
          description: Success
        '400':
          description: The request is not valid
        '401':
          description: Sign in required
        '403':
          description: Your account is not allowed to do this

  /service-types/{id}:
    patch:
      summary: Edit a service type
      description: |-
        Admin only.

        Allowed roles: admin.
      tags:
        - Service types
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  minLength: 1
                category:
                  type: string
                  enum:
                    - domestic
                    - industrial
                description:
                  type: string
                requiresCoshh:
                  type: boolean
      responses:
        '200':
          description: Success
        '400':
          description: The request is not valid
        '401':
          description: Sign in required
        '403':
          description: Your account is not allowed to do this

  /subscriptions/me:
    get:
      summary: View my subscription
      description: >-
        The cleaner's own active platform subscription, or `null`. Includes `billingInterval` (`week` or
        `month`).


        Allowed roles: cleaner.
      tags:
        - Subscriptions
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Success
        '401':
          description: Sign in required
        '403':
          description: Your account is not allowed to do this

  /subscriptions/me/cancellation-request:
    post:
      summary: Ask to cancel the platform subscription
      description: |-
        The cleaner asks to leave. Their plan and billing carry on until an admin confirms by email.

        Allowed roles: cleaner.
      tags:
        - Subscriptions
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                reason:
                  type: string
                  maxLength: 500
      responses:
        '201':
          description: Request recorded
        '400':
          description: The request is not valid
        '401':
          description: Sign in required
        '403':
          description: Your account is not allowed to do this
    delete:
      summary: Withdraw a cancellation request
      description: |-
        Withdraws a request that an admin has not yet decided.

        Allowed roles: cleaner.
      tags:
        - Subscriptions
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Request withdrawn
        '401':
          description: Sign in required
        '403':
          description: Your account is not allowed to do this

  /subscriptions/setup-intent:
    post:
      summary: Start entering a card for the subscription
      description: >-
        Creates (or reuses) the cleaner's Stripe customer and returns a SetupIntent client secret so a
        card can be entered with Stripe.js.


        Allowed roles: cleaner, admin.
      tags:
        - Subscriptions
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                cleanerId:
                  type: string
                  pattern: ^[0-9a-fA-F]{24}$
              required:
                - cleanerId
      responses:
        '200':
          description: Client secret returned
        '400':
          description: The request is not valid
        '401':
          description: Sign in required
        '403':
          description: Your account is not allowed to do this

  /webhooks/stripe:
    post:
      summary: Stripe webhook receiver
      description: >-
        Called by Stripe, not by the website. The signature is verified before anything is trusted, and
        each event is processed once. Handles payment, subscription, invoice and payout-account events.


        Public: authorised by the Stripe signature.
      tags:
        - Webhooks
      responses:
        '200':
          description: Event received

  /sms-alerts/me:
    get:
      summary: View my text alert settings
      description: >-
        Whether text alerts are on, the UK mobile number if so, whether text sending is set up on the
        server, and the exact wording the person agrees to (with its version).


        Allowed roles: customer, cleaner.
      tags:
        - Text alerts
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Success
        '401':
          description: Sign in required
        '403':
          description: Your account is not allowed to do this
    put:
      summary: Turn on text alerts
      description: >-
        Needs a UK mobile number, the tick-box agreement (`consent: true`) and the `consentVersion` of
        the wording shown (a changed wording returns 409). Records when and to which wording the person
        agreed. Texts are short service messages, never advertising, and do not mention the job itself.


        Allowed roles: customer, cleaner.
      tags:
        - Text alerts
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                mobile:
                  type: string
                  minLength: 6
                  maxLength: 30
                consentVersion:
                  type: string
                  minLength: 1
                  maxLength: 40
                consent:
                  type: boolean
                  enum:
                    - true
              required:
                - mobile
                - consentVersion
                - consent
      responses:
        '200':
          description: Success
        '400':
          description: The request is not valid
        '401':
          description: Sign in required
        '403':
          description: Your account is not allowed to do this
    delete:
      summary: Turn off text alerts
      description: |-
        Turns text alerts off and deletes the stored mobile number.

        Allowed roles: customer, cleaner.
      tags:
        - Text alerts
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Success
        '401':
          description: Sign in required
        '403':
          description: Your account is not allowed to do this

  /auth/email-status:
    get:
      summary: Has my email address been confirmed?
      description: >-
        Returns whether the signed-in person has confirmed their address, whether they are currently
        blocked from posting jobs, accepting offers or subscribing until they do, and whether the server
        can send the email at all.
      tags:
        - Auth
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Success
        '401':
          description: Sign in required

  /auth/resend-verification:
    post:
      summary: Send a new email confirmation link
      description: >-
        For the signed-in customer or cleaner whose address is not yet confirmed. An earlier link stops
        working. One request a minute, five an hour.
      tags:
        - Auth
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Link sent (or the address was already confirmed)
        '401':
          description: Sign in required

  /auth/verify-email:
    post:
      summary: Confirm an email address with the emailed link
      description: >-
        Takes the token from the confirmation email. The link works once and expires after 48 hours.
        Public: the token is the credential.
      tags:
        - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                token:
                  type: string
                  minLength: 20
                  maxLength: 200
              required:
                - token
      responses:
        '200':
          description: Success
        '400':
          description: The request is not valid

components:

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    JobId:
      name: id
      in: path
      required: true
      schema:
        type: string

    CleanerId:
      name: id
      in: path
      required: true
      schema:
        type: string

  schemas:

    RegisterRequest:
      type: object
      required:
        - name
        - email
        - password
        - role
      properties:
        name:
          type: string
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
        role:
          type: string
          description: Admin accounts cannot be self-registered.
          enum: [customer, cleaner]
        phone:
          type: string

    LoginRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
        password:
          type: string

    User:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        email:
          type: string
        role:
          type: string
          enum: [customer, cleaner, operator, admin]
        phone:
          type: string

    AuthResponse:
      type: object
      properties:
        user:
          $ref: '#/components/schemas/User'
        token:
          type: string

    JobCreateRequest:
      type: object
      required:
        - serviceType
        - postcode
        - budgetMin
        - budgetMax
      properties:
        serviceType:
          type: string
        category:
          type: string
          enum: [domestic, industrial]
        postcode:
          type: string
        description:
          type: string
        estimatedHours:
          type: number
        frequency:
          type: string
          enum: [one_off, weekly, monthly, contract]
        budgetMin:
          type: number
        budgetMax:
          type: number

    Job:
      type: object
      properties:
        id:
          type: string
        serviceType:
          type: string
        category:
          type: string
        postcode:
          type: string
        lat:
          type: number
        lng:
          type: number
        status:
          type: string
          enum: [open, allocated, in_progress, completed, cancelled]

    AllocationResult:
      type: object
      properties:
        jobId:
          type: string
        offers:
          type: array
          items:
            $ref: '#/components/schemas/JobOffer'

    JobOffer:
      type: object
      properties:
        cleanerId:
          type: string
        score:
          type: number
        status:
          type: string
          enum: [sent, accepted, declined, expired]

    CleanerCreateRequest:
      type: object
      required:
        - name
        - basePostcode
      properties:
        name:
          type: string
        companyName:
          type: string
        basePostcode:
          type: string
        services:
          type: array
          items:
            type: string
        dbsVerified:
          type: boolean
        coshhTrained:
          type: boolean

    CleanerProfile:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        companyName:
          type: string
        basePostcode:
          type: string
        lat:
          type: number
        lng:
          type: number
        coverageType:
          type: string
          enum: [radius, polygon]
        coverageRadiusKm:
          type: number
        coveragePolygon:
          type: object
        insuranceStatus:
          type: string
          enum: [none, own, platform]
        ratingAverage:
          type: number
        ratingCount:
          type: number

    CoverageRequest:
      type: object
      properties:
        cleanerId:
          type: string
        coverageType:
          type: string
          enum: [radius, polygon]
        radiusKm:
          type: number
        polygon:
          type: object

    SubscriptionRequest:
      type: object
      required:
        - cleanerId
        - plan
      properties:
        cleanerId:
          type: string
        plan:
          type: string
          enum: [starter, pro]
          description: Industrial Pro is no longer offered to new subscribers; existing ones keep it.

    InsuranceAddOnRequest:
      type: object
      required:
        - cleanerId
      properties:
        cleanerId:
          type: string

    Subscription:
      type: object
      properties:
        id:
          type: string
        cleanerId:
          type: string
        plan:
          type: string
        isActive:
          type: boolean
        insuranceAddOn:
          type: boolean
