openapi: 3.0.3
info:
  title: CleanOps Connect API
  version: 1.0.0
  description: >
    Backend API for CleanOps Connect — a UK domestic and industrial cleaning
    lead allocation platform using AI scoring, Mapbox geolocation, cleaner
    subscriptions, insurance add-ons, and compliance checks.

servers:
  - url: https://api.cleanopsconnect.com
    description: Production server
  - url: http://localhost:4000
    description: Local development

paths:

  /auth/register:
    post:
      summary: Register a new user (customer or cleaner)
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: User registered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '409':
          description: Email already registered

  /auth/login:
    post:
      summary: Log in and obtain a JWT
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          description: Invalid email or password

  /jobs:
    post:
      summary: Create a new cleaning job
      tags: [Jobs]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JobCreateRequest'
      responses:
        '201':
          description: Job created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'

  /jobs/{id}:
    get:
      summary: Get job details
      description: >
        Visible only to the customer who posted the job, a cleaner who was
        offered or booked it, or an admin. Stripe fields are omitted for
        non-admins.
      tags: [Jobs]
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/JobId'
      responses:
        '200':
          description: Job details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
        '401':
          description: Authentication required
        '403':
          description: You do not have access to this job
        '404':
          description: Job not found

  /jobs/describe:
    post:
      summary: Suggest wording for a job description (customer only, AI-assisted)
      description: Sends the job type, frequency, hours and the customer's draft text to Anthropic. Returns 503 when AI help is not configured or unavailable.
      tags: [Jobs]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [category]
              properties:
                category: { type: string, enum: [domestic, industrial] }
                serviceType: { type: string }
                frequency: { type: string, enum: [one_off, weekly, monthly, contract] }
                estimatedHours: { type: number }
                draft: { type: string, maxLength: 2000 }
      responses:
        '200':
          description: Suggested description
        '503':
          description: AI writing help unavailable
  /cleaners/me/describe-bio:
    post:
      summary: Suggest wording for the cleaner's public bio (cleaner only, AI-assisted)
      description: Sends the cleaner's service names, travel distance and draft bio to Anthropic. Returns 503 when AI help is not configured or unavailable. Shares the AI writing rate limit with /jobs/describe.
      tags: [Cleaners]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                services: { type: array, items: { type: string } }
                customServices: { type: array, items: { type: string } }
                travelDistanceMiles: { type: number }
                acceptEmergencyBookings: { type: boolean }
                draft: { type: string, maxLength: 2000 }
      responses:
        '200':
          description: Suggested bio
        '503':
          description: AI writing help unavailable
  /jobs/{id}/offers/{offerId}/quote:
    post:
      summary: Send or revise a tender quote (invited cleaner only)
      description: For industrial jobs posted as a tender. The cleaner sets their own price (`pricePence`); the platform never sets or suggests one. The optional note has contact details hidden. Allowed until the tender's closing time, and only while the job is unawarded.
      tags: [Jobs]
      security:
        - bearerAuth: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: offerId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [pricePence]
              properties:
                pricePence: { type: integer, minimum: 1 }
                message: { type: string, maxLength: 1500 }
      responses:
        '200':
          description: The updated offer, now `quoted`
        '400':
          description: Not a tender, tender closed or already awarded
        '403':
          description: This invitation was not sent to you
  /jobs/{id}/offers/{offerId}/award:
    post:
      summary: Award a tender to one quote (the job's customer)
      description: Books the job at the cleaner's quoted price using the same atomic booking as accepting an offer, declines all other offers, and emails the unsuccessful bidders. The customer then pays to confirm.
      tags: [Jobs]
      security:
        - bearerAuth: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: offerId, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: The booked job (paymentStatus BOOKED)
        '400':
          description: Not a tender, no quote from that cleaner, or already awarded
        '409':
          description: The job was just booked another way
  /jobs/{id}/documents/{kind}:
    get:
      summary: Printable job document (service record, or compliance pack for industrial jobs)
      description: Returns an HTML page (never cached). Only the job's customer, its booked cleaner or an admin; 409 until a cleaner is booked; the compliance pack is 400 for non-industrial jobs. States only recorded facts, and leaves the COSHH and risk sections blank for the cleaner.
      tags: [Jobs]
      security:
        - bearerAuth: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: kind, in: path, required: true, schema: { type: string, enum: [service-record, compliance-pack] } }
      responses:
        '200':
          description: text/html document
        '403':
          description: Not a party to this job
        '409':
          description: No cleaner booked yet
  /pricing/guide:
    post:
      summary: Suggested local rates for a service (customer or cleaner, informational)
      description: A suggested range of typical local hourly rates, from prices published online for the postcode district. Only the district and service type are sent to the AI service. Cached per district and service. Never fills in or enforces anything. 503 if unavailable, 404 if no usable local figures were found.
      tags: [Pricing]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [serviceType, postcode]
              properties:
                serviceType: { type: string }
                postcode: { type: string, description: Full postcode or just the district, e.g. LS12 }
                estimatedHours: { type: number }
      responses:
        '200':
          description: "{ area, hourlyLowPence, hourlyHighPence, scope, basis, confidence, sources[], asOf, job? }"
        '404':
          description: No usable local figures found
        '503':
          description: Price guide unavailable
  /chat/unread:
    get:
      summary: Unread chat message counts for the signed-in customer or cleaner
      tags: [Chat]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: "{ total, byJob: { jobId: count } }"
  /chat/jobs/{id}/messages:
    get:
      summary: List chat messages for a job (customer or the booked cleaner only)
      description: Marks the other person's messages as read. `after` is a message id, for polling. The response says whether the conversation is open and writable.
      tags: [Chat]
      security:
        - bearerAuth: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: after, in: query, required: false, schema: { type: string } }
      responses:
        '200':
          description: "{ open, writable, reason?, role, messages[] }"
        '403':
          description: Not a participant in this job
    post:
      summary: Send a chat message
      description: Phone numbers, emails, full postcodes, links and handles are hidden by the server before the message is stored. The response says `masked` and gives a `notice` for the sender. Chat opens when a cleaner accepts the job and is read-only once the job is no longer active (409).
      tags: [Chat]
      security:
        - bearerAuth: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [body]
              properties:
                body: { type: string, maxLength: 1000 }
      responses:
        '201':
          description: "{ message, masked, notice? }"
        '409':
          description: Chat is not open yet, or is read-only
        '429':
          description: Too many messages
  /chat/jobs/{id}/stream:
    get:
      summary: Live chat stream (server-sent events)
      description: "Sends an `event: message` frame when the other person writes. Read with fetch() so the Authorization header can be used; clients also poll as a fallback."
      tags: [Chat]
      security:
        - bearerAuth: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: text/event-stream
  /ops/jobs/{id}/messages/view:
    post:
      summary: Staff read-only view of a job's chat (reason required, audited)
      tags: [Ops]
      security:
        - bearerAuth: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string }
      responses:
        '200':
          description: Messages as stored, with contactMasked and maskedKinds
  /jobs/{id}/allocate:
    post:
      summary: Allocate job to cleaners using AI scoring
      description: >
        Offers the job to the best-matching cleaners who offer the service, are
        available and not suspended, cover the job location and (for high-risk
        jobs) are insured. Cleaners already offered the job are skipped, so it
        is safe to run again. If nobody matches, no offers are created and the
        job stays open. Admins also get a `diagnostics` object counting the
        cleaners stopped by each rule.
      tags: [Jobs]
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/JobId'
      responses:
        '200':
          description: Allocation results
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AllocationResult'

  /cleaners:
    post:
      summary: Register a new cleaner
      tags: [Cleaners]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CleanerCreateRequest'
      responses:
        '201':
          description: Cleaner created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CleanerProfile'

  /cleaners/{id}:
    get:
      summary: Get a cleaner's public profile
      description: >
        Returns only public fields (name, services, compliance badges, rating,
        availability and the outward postcode as `area`). Contact details,
        exact postcode, coordinates, Stripe and commission data are never
        returned. Suspended cleaners return 404.
      tags: [Cleaners]
      parameters:
        - $ref: '#/components/parameters/CleanerId'
      responses:
        '200':
          description: Public cleaner profile
        '404':
          description: Cleaner not found

  /cleaners/coverage:
    post:
      summary: Set cleaner coverage area (radius or polygon)
      tags: [Cleaners]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CoverageRequest'
      responses:
        '200':
          description: Coverage updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CleanerProfile'

  /subscriptions:
    post:
      summary: Activate subscription plan
      tags: [Subscriptions]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubscriptionRequest'
      responses:
        '201':
          description: Subscription activated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Subscription'

  /subscriptions/insurance:
    post:
      summary: Add insurance add-on to subscription
      tags: [Subscriptions]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InsuranceAddOnRequest'
      responses:
        '200':
          description: Insurance added
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Subscription'


  # --- Operator (platform ops) API: operators and admins -------------------
  /ops/summary:
    get:
      summary: Ops queue counts (disputes, approvals, verification, stuck payouts)
      tags: [Ops]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Counts, plus the operator refund limit in pence
        '401':
          description: Not logged in, or the staff account is deactivated
        '403':
          description: Not a staff account

  /ops/disputes:
    get:
      summary: List open disputes, oldest first
      tags: [Ops]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Jobs in the DISPUTED state

  /ops/disputes/{id}:
    get:
      summary: Dispute detail with notes, audit timeline and any pending approval
      tags: [Ops]
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/JobId'
      responses:
        '200':
          description: Dispute detail

  /ops/disputes/{id}/resolve:
    post:
      summary: Resolve a dispute
      description: >
        Operators whose refund is above OPS_REFUND_LIMIT_PENCE (default 15000)
        get 202 and an approval request for an admin; no money moves until it
        is approved. Admins are not limited. Every resolution is audited.
      tags: [Ops]
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/JobId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [outcome, reason]
              properties:
                outcome:
                  type: string
                  enum: [payout, refund, partial]
                refundPence:
                  type: integer
                  description: Required for a partial refund; less than the job price
                reason:
                  type: string
                  minLength: 3
      responses:
        '200':
          description: Resolved
        '202':
          description: Sent to an admin for approval
        '400':
          description: Validation failed or the job is not disputed
        '409':
          description: A resolution for this job is already awaiting approval

  /ops/cleaners:
    get:
      summary: List cleaners (filters as /admin/cleaners)
      tags: [Ops]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Cleaners

  /ops/cleaners/{id}/verification:
    patch:
      summary: Record DBS / COSHH / insurance verification with the evidence checked
      tags: [Ops]
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/CleanerId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                dbsVerified:
                  type: boolean
                coshhTrained:
                  type: boolean
                insuranceStatus:
                  type: string
                  enum: [none, own, platform]
                reason:
                  type: string
      responses:
        '200':
          description: Updated and audited

  /ops/cleaners/{id}/review:
    patch:
      summary: Put a cleaner under review or re-activate them
      description: Operators cannot suspend a cleaner or lift a suspension (403).
      tags: [Ops]
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/CleanerId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [deactivationStatus, reason]
              properties:
                deactivationStatus:
                  type: string
                  enum: [active, under_review]
                reason:
                  type: string
      responses:
        '200':
          description: Updated and audited
        '403':
          description: The cleaner is suspended; only an admin can change them

  /ops/jobs/{id}/notes:
    post:
      summary: Add an internal staff note to a job
      tags: [Ops]
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/JobId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [body]
              properties:
                body:
                  type: string
                  maxLength: 2000
      responses:
        '201':
          description: Note added

  # --- Admin-only additions ---------------------------------------------------
  /admin/approvals:
    get:
      summary: List refund approval requests
      tags: [Admin]
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: status
          schema:
            type: string
            enum: [pending, approved, rejected]
      responses:
        '200':
          description: Approval requests

  /admin/approvals/{id}/decision:
    post:
      summary: Approve (issues the refund) or reject a refund request
      description: The admin who raised a request cannot decide it.
      tags: [Admin]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decision, reason]
              properties:
                decision:
                  type: string
                  enum: [approve, reject]
                reason:
                  type: string
      responses:
        '200':
          description: Decided and audited
        '409':
          description: Already decided, or the job is no longer disputed

  /admin/audit:
    get:
      summary: Read the staff audit log (newest first, max 200)
      tags: [Admin]
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: action
          schema:
            type: string
        - in: query
          name: actor
          schema:
            type: string
        - in: query
          name: from
          schema:
            type: string
            format: date-time
        - in: query
          name: to
          schema:
            type: string
            format: date-time
      responses:
        '200':
          description: Audit entries

  /admin/users:
    get:
      summary: List staff (operator/admin) accounts
      tags: [Admin]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Staff accounts
    post:
      summary: Create a staff account
      tags: [Admin]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email, password, role]
              properties:
                name:
                  type: string
                email:
                  type: string
                  format: email
                password:
                  type: string
                  minLength: 12
                role:
                  type: string
                  enum: [operator, admin]
      responses:
        '201':
          description: Created and audited
        '409':
          description: Email already registered

  /admin/users/{id}:
    patch:
      summary: Deactivate or re-activate a staff account
      description: Takes effect on the account's next request. An admin cannot deactivate themselves.
      tags: [Admin]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [active, reason]
              properties:
                active:
                  type: boolean
                reason:
                  type: string
      responses:
        '200':
          description: Updated and audited


  # --- Phase 3: customer and cleaner journeys --------------------------------
  /jobs/mine:
    get:
      summary: The logged-in customer's jobs, newest first
      tags: [Jobs]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Jobs without payment internals

  /jobs/{id}/offers:
    get:
      summary: Offers on the customer's job, with each cleaner's public details
      tags: [Jobs]
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/JobId'
      responses:
        '200':
          description: Offers
        '403':
          description: Not the customer who posted the job

  /jobs/{id}/review:
    get:
      summary: The customer's review of this job, and whether they can leave one
      tags: [Reviews]
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/JobId'
      responses:
        '200':
          description: '{ review, canReview }'
    post:
      summary: Review the cleaner after a completed job (one review per job)
      tags: [Reviews]
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/JobId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [rating]
              properties:
                rating:
                  type: integer
                  minimum: 1
                  maximum: 5
                comment:
                  type: string
                  maxLength: 1000
      responses:
        '201':
          description: Review published; the cleaner's rating is recalculated
        '400':
          description: The job is not completed yet, or is under dispute
        '409':
          description: Already reviewed

  /payments/jobs/{id}/intent:
    get:
      summary: Client secret for paying a BOOKED job with Stripe.js
      tags: [Payments]
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/JobId'
      responses:
        '200':
          description: '{ clientSecret, amountPence, status }'
        '400':
          description: The job is not waiting for payment

  /cleaners/me/offers:
    get:
      summary: The cleaner's job offers (outward postcode only until booked)
      tags: [Cleaners]
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: status
          schema:
            type: string
            enum: [sent, accepted, declined, expired]
      responses:
        '200':
          description: Offers with distance and job details

  /cleaners/me/jobs:
    get:
      summary: Jobs booked with the cleaner
      tags: [Cleaners]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Booked jobs with the customer's name and full postcode

  /cleaners/me/earnings:
    get:
      summary: Paid out, on the way, and held-in-escrow totals
      tags: [Cleaners]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Earnings summary and jobs

  /cleaners/me/payouts/onboarding:
    post:
      summary: Start or continue Stripe Connect Express payout set-up
      description: Creates the connected account on first use and returns a hosted Stripe onboarding URL. Needs FRONTEND_URL.
      tags: [Cleaners]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: '{ url }'

  /cleaners/me/payouts/status:
    get:
      summary: Payout set-up status, synced from Stripe
      tags: [Cleaners]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: '{ connected, detailsSubmitted, payoutsEnabled, requirementsDue }'

  /cleaners/me/payouts/dashboard:
    post:
      summary: Single-use link to the cleaner's Stripe Express dashboard
      tags: [Cleaners]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: '{ url }'

  /cleaners/{id}/reviews:
    get:
      summary: Published reviews for a cleaner (reviewer shown as first name and last initial)
      tags: [Reviews]
      parameters:
        - $ref: '#/components/parameters/CleanerId'
      responses:
        '200':
          description: Reviews

  /reviews/latest:
    get:
      summary: Latest published reviews in date order, with the overall average
      tags: [Reviews]
      parameters:
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 20
      responses:
        '200':
          description: '{ averageRating, count, reviews }'

  /ops/reviews:
    get:
      summary: Reviews for moderation
      tags: [Ops]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Reviews

  /ops/reviews/{id}:
    patch:
      summary: Hide or re-publish a review for a content-policy reason (audited)
      tags: [Ops]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [hidden, reason]
              properties:
