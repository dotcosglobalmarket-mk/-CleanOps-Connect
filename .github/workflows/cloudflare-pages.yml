name: Deploy Frontend to Cloudflare Pages

on:
  push:
    branches:
      - main
    paths:
      - 'frontend/**'
      - '.github/workflows/cloudflare-pages.yml'

env:
  CLOUDFLARE_PAGES_PROJECT: cleanops-connect

jobs:
  deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
          VITE_MAPBOX_TOKEN: ${{ secrets.VITE_MAPBOX_TOKEN }}

      - name: Ensure Cloudflare Pages project exists
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          project_endpoint="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects/${CLOUDFLARE_PAGES_PROJECT}"
          auth_prefix="Authorization: Bearer "

          status_code="$(curl --silent --show-error --output /tmp/cloudflare-pages-project.json --write-out '%{http_code}' \
            --header "${auth_prefix}${CLOUDFLARE_API_TOKEN}" \
            "${project_endpoint}")"

          if [ "${status_code}" = "200" ]; then
            exit 0
          fi

          if [ "${status_code}" != "404" ]; then
            cat /tmp/cloudflare-pages-project.json
            echo "Failed to look up Cloudflare Pages project '${CLOUDFLARE_PAGES_PROJECT}'." >&2
            exit 1
          fi

          create_status="$(curl --silent --show-error --output /tmp/cloudflare-pages-project-create.json --write-out '%{http_code}' \
            --request POST \
            --header "${auth_prefix}${CLOUDFLARE_API_TOKEN}" \
            --header 'Content-Type: application/json' \
            --data "{\"name\":\"${CLOUDFLARE_PAGES_PROJECT}\",\"production_branch\":\"main\",\"source\":{\"type\":\"direct_upload\"}}" \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects")"

          case "${create_status}" in
            200|201)
              ;;
            *)
              cat /tmp/cloudflare-pages-project-create.json
              echo "Failed to create Cloudflare Pages project '${CLOUDFLARE_PAGES_PROJECT}'." >&2
              exit 1
              ;;
          esac

      # Uploads frontend/dist to Cloudflare Pages via the official action, which
      # calls the same Direct Upload API documented at
      # https://developers.cloudflare.com/api/operations/pages-deployment-create-deployment
      # under the hood. No wrangler.toml is used or required — the three
      # secrets below are passed directly as action inputs. Because this
      # uploads a pre-built directory, Cloudflare's own framework
      # auto-detection is never invoked.
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: ${{ env.CLOUDFLARE_PAGES_PROJECT }}
          directory: frontend/dist
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
