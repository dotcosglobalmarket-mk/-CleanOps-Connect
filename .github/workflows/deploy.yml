name: Deploy to DigitalOcean App Platform

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run test suite
        run: npm test

  deploy:
    name: Deploy App
    needs: test
    # Only deploy from main, never from a pull request.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: DO_API_TOKEN

    steps:
      - name: Install doctl
        uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DO_API_TOKEN }}

      # Redeploys the latest commit using the app's CURRENT configuration.
      # We deliberately do not run `doctl apps update --spec .do/app.yaml`:
      # that spec holds placeholder values (REPLACE_WITH_...) for secrets and
      # no Stripe keys, so applying it would overwrite the real production
      # secrets. Environment variables are managed in the DigitalOcean
      # dashboard (App -> Settings -> Environment Variables).
      #
      # DO_APP_ID must be the app's UUID. A pasted dashboard URL or stray
      # whitespace is tolerated (the UUID is extracted); anything else fails
      # with a clear message instead of DigitalOcean's bare 404/405.
      - name: Deploy to DigitalOcean App Platform
        env:
          RAW_APP_ID: ${{ secrets.DO_APP_ID }}
        run: |
          APP_ID=$(printf '%s' "$RAW_APP_ID" | tr -d '[:space:]' | grep -oiE '[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}' | head -n1 || true)
          if [ -z "$APP_ID" ]; then
            echo "::error::DO_APP_ID must be the app's UUID (like 1a2b3c4d-1111-2222-3333-444455556666). Copy it from the app's page address, cloud.digitalocean.com/apps/<uuid>, or run 'doctl apps list'."
            exit 1
          fi
          doctl apps create-deployment "$APP_ID" --wait
