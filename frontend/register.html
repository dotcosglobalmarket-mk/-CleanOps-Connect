<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Register — CleanOps Connect</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🧽</text></svg>" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <header class="site-header">
    <nav id="site-nav"></nav>
  </header>

  <main>
    <div class="card" style="max-width: 480px; margin: 0 auto;">
      <h2>Create an account</h2>
      <div id="alert" class="alert alert-error" hidden></div>

      <form id="register-form">
        <div class="form-row">
          <label for="role">I am a</label>
          <select id="role" required>
            <option value="customer">Customer (I need cleaning done)</option>
            <option value="cleaner">Cleaner (I offer cleaning services)</option>
          </select>
        </div>

        <div class="form-row">
          <label for="name">Full name</label>
          <input id="name" type="text" required />
        </div>

        <div class="form-row">
          <label for="email">Email</label>
          <input id="email" type="email" required />
        </div>

        <div class="form-row">
          <label for="phone">Phone (optional)</label>
          <input id="phone" type="tel" />
        </div>

        <div class="form-row">
          <label for="password">Password</label>
          <input id="password" type="password" minlength="8" required />
          <span class="field-help">At least 8 characters.</span>
        </div>

        <button type="submit">Create account</button>
      </form>
    </div>
  </main>

  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/nav.js"></script>
  <script src="js/register.js"></script>
</body>
</html>
