<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Customer dashboard — CleanOps Connect</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🧽</text></svg>" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <header class="site-header">
    <nav id="site-nav"></nav>
  </header>

  <main>
    <h1>Customer dashboard</h1>

    <div class="card">
      <h2>Post a job</h2>
      <div id="create-alert" class="alert alert-error" hidden></div>
      <div id="create-success" class="alert alert-success" hidden></div>

      <form id="create-job-form">
        <div class="form-row">
          <label for="serviceType">Service type ID</label>
          <input id="serviceType" type="text" placeholder="507f1f77bcf86cd799439011" required />
          <span class="field-help">Ask your administrator for a valid service type ID.</span>
        </div>

        <div class="form-row">
          <label for="category">Category</label>
          <select id="category" required>
            <option value="domestic">Domestic</option>
            <option value="industrial">Industrial</option>
          </select>
        </div>

        <div class="form-row">
          <label for="postcode">Postcode</label>
          <input id="postcode" type="text" placeholder="SW1A 1AA" required />
        </div>

        <div class="form-row">
          <label for="description">Description (optional)</label>
          <textarea id="description" rows="3"></textarea>
        </div>

        <div class="form-row">
          <label for="frequency">Frequency</label>
          <select id="frequency">
            <option value="one_off">One-off</option>
            <option value="weekly">Weekly</option>
            <option value="monthly">Monthly</option>
            <option value="contract">Contract</option>
          </select>
        </div>

        <div class="form-row">
          <label for="estimatedHours">Estimated hours (optional)</label>
          <input id="estimatedHours" type="number" min="0" step="0.5" />
        </div>

        <div class="two-column">
          <div class="form-row">
            <label for="budgetMin">Budget min (£)</label>
            <input id="budgetMin" type="number" min="0" step="1" required />
          </div>
          <div class="form-row">
            <label for="budgetMax">Budget max (£)</label>
            <input id="budgetMax" type="number" min="0" step="1" required />
          </div>
        </div>

        <button type="submit">Post job</button>
      </form>
    </div>

    <div class="card">
      <h2>View a job</h2>
      <div id="view-alert" class="alert alert-error" hidden></div>

      <div class="form-row">
        <label for="jobId">Job ID</label>
        <input id="jobId" type="text" />
      </div>

      <div style="display: flex; gap: 0.75rem; margin-bottom: 1rem;">
        <button id="view-job-button" type="button">View job</button>
        <button id="allocate-job-button" type="button" class="secondary">Allocate cleaners</button>
      </div>

      <pre id="job-details" style="white-space: pre-wrap; font-size: 0.85rem;" hidden></pre>

      <h3 id="offers-heading" hidden>Ranked offers</h3>
      <ul id="offers-list" class="offer-list" hidden></ul>
    </div>
  </main>

  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/nav.js"></script>
  <script src="js/customer.js"></script>
</body>
</html>
