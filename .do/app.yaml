# Reference spec for the DigitalOcean app. It is NOT applied automatically by
# CI (see .github/workflows/deploy.yml). Secret values below are placeholders;
# the real values live only in the DigitalOcean dashboard. Required runtime
# variables: PORT, MONGO_URI, MAPBOX_API_KEY, JWT_SECRET, STRIPE_SECRET_KEY,
# STRIPE_WEBHOOK_SECRET, and optionally CORS_ORIGINS, AUTH_RATE_LIMIT_MAX and
# OPS_REFUND_LIMIT_PENCE (operator refund limit before admin approval; default
# 15000 = £150).
# Phase 3: FRONTEND_URL (e.g. https://www.cleanop-connect.co.uk, used for Stripe
# onboarding return links and email links), RESEND_API_KEY and EMAIL_FROM
# (e.g. "CleanOps Connect <bookings@cleanop-connect.co.uk>" on a domain verified
# in Resend), OPS_NOTIFICATION_EMAIL (dispute and payout alerts), and
# STRIPE_CONNECT_WEBHOOK_SECRET if Connect events use a separate endpoint.
name: cleanops-connect
region: lon
services:
  - name: api
    dockerfile_path: ./Dockerfile
    source_dir: .
    github:
      repo: dotcosglobalmarket-mk/-CleanOps-Connect
      branch: main
      deploy_on_push: true
    run_command: "npm start"
    http_port: 4000
    instance_count: 1
    instance_size_slug: basic-xxs
    routes:
      - path: /
    envs:
      - key: PORT
        value: "4000"
        scope: RUN_TIME
      - key: MONGO_URI
        value: "REPLACE_WITH_MONGO_URI"
        scope: RUN_TIME
        type: SECRET
      - key: MAPBOX_API_KEY
        value: "REPLACE_WITH_MAPBOX_API_KEY"
        scope: RUN_TIME
        type: SECRET
      - key: JWT_SECRET
        value: "REPLACE_WITH_JWT_SECRET"
        scope: RUN_TIME
        type: SECRET
      - key: CORS_ORIGINS
        value: "https://www.cleanop-connect.co.uk,https://cleanop-connect.co.uk"
        scope: RUN_TIME
